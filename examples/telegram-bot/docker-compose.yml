# docker-compose.yml
version: "3"

services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    ports:
      - 3000:3000
    networks:
      - app_network
  bot:
    container_name: telegram-bot-bot-1 # Explicitly set container name for easier logging
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
    # Change restart policy for a long-running service
    restart: on-failure # or 'always' for production
    command: ["./bot"]
    environment:
      - TELOXIDE_TOKEN=8151344098:AAFcWpdHz99UTUk7YWnHxVAXCKZGieQz9G0
      # - RUST_LOG=info # Removed, as we're using println! for debugging
    tty: true
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
